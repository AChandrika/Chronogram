name: Update calendar data

on:
  schedule:
    - cron: '17 9 * * *'    # full refresh every day, ~4:17am New York time
    - cron: '41 * * * *'    # Google Sheet refresh every hour
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = re-crawl Chronogram, sheet = only re-read the Google Sheet'
        default: 'sheet'
        type: choice
        options: [sheet, full]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Refresh data
        run: |
          if [ "${{ github.event.schedule }}" = "17 9 * * *" ] || [ "${{ inputs.mode }}" = "full" ] || [ ! -f data/cache/chronogram-events.json ]; then
            node scripts/update.mjs
          else
            node scripts/update.mjs --sheet
          fi
      - name: Save changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update calendar data"
          git pull --rebase --autostash || true
          git push
